# A Vault dev server for the examples. Dev mode keeps everything in memory and
# uses the root token below: never use it for real keys.
services:
    vault:
        image: hashicorp/vault:1.20
        ports:
            - "8200:8200"
        environment:
            VAULT_DEV_ROOT_TOKEN_ID: root
            VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
        cap_add:
            - IPC_LOCK
